apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: company-bot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AkaashSamson/Company_Bot.git
    targetRevision: Deployment
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: company-bot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

