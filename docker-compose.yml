services:
  backend:
    image: ghcr.io/abhiiiiiinav/knowlayer-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      target: backend
    container_name: knowlayer-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GIT_COMMIT=${IMAGE_TAG:-dev-local}
      - HF_HOME=/root/.cache/huggingface
      - DATABASE_URL=sqlite:////data/sqlite/knowlayer.db
      - CHROMA_PERSIST_DIRECTORY=/data/chroma
      - DOCUMENTS_DIR=/data/uploads
    volumes:
      - /data/sqlite:/data/sqlite
      - /data/chroma:/data/chroma
      - /data/hf_cache:/root/.cache/huggingface
      - /data/uploads:/data/uploads

  frontend:
    image: ghcr.io/abhiiiiiinav/knowlayer-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      target: frontend
    container_name: knowlayer-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - GIT_COMMIT=${IMAGE_TAG:-dev-local}
      - STREAMLIT_API_BASE_URL=http://backend:8000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

