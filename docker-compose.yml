services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home
    user: "0"  # root user
    restart: unless-stopped

  backend:
    image: ghcr.io/abhiiiiiinav/knowlayer-backend:latest
    build:
      context: .
      target: backend
    container_name: knowlayer-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - DATABASE_URL=sqlite:////data/sqlite/knowlayer.db
      - CHROMA_PERSIST_DIRECTORY=/data/chroma
      - DOCUMENTS_DIR=/data/uploads
    volumes:
      - /data/sqlite:/data/sqlite
      - /data/chroma:/data/chroma
      - /data/hf_cache:/root/.cache/huggingface
      - /data/uploads:/data/uploads

  frontend:
    image: ghcr.io/abhiiiiiinav/knowlayer-frontend:latest
    build:
      context: .
      target: frontend
    container_name: knowlayer-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
