apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowlayer-sqlite-pvc
  namespace: company-bot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowlayer-chroma-pvc
  namespace: company-bot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
