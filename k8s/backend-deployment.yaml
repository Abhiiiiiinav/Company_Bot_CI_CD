apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowlayer-api
  namespace: company-bot
  labels:
    app: knowlayer-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: knowlayer-api
  template:
    metadata:
      labels:
        app: knowlayer-api
    spec:
      containers:
        - name: knowlayer-api
          image: knowlayer-api:abhinav-qwen-cicd-12-d4e06f6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: knowlayer-config
            - secretRef:
                name: knowlayer-secrets
                optional: true
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/instance
            - name: chroma-storage
              mountPath: /app/.chroma
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: knowlayer-sqlite-pvc
        - name: chroma-storage
          persistentVolumeClaim:
            claimName: knowlayer-chroma-pvc
